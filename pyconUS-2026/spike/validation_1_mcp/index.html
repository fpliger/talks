<!DOCTYPE html>
<html lang="en">
<head>
    <title>Validation 1: MCP SDK under Pyodide</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">

    <link rel="stylesheet" href="https://pyscript.net/releases/2026.2.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2026.2.1/core.js"></script>

    <style>
        body { font-family: system-ui, sans-serif; max-width: 800px; margin: 2rem auto; padding: 0 1rem; }
        .result { padding: 1rem; margin: 1rem 0; border-radius: 4px; }
        .pass { background: #d4edda; border: 1px solid #c3e6cb; }
        .fail { background: #f8d7da; border: 1px solid #f5c6cb; }
        .info { background: #d1ecf1; border: 1px solid #bee5eb; }
        pre { background: #f4f4f4; padding: 1rem; overflow-x: auto; }
        h1 { color: #333; }
        button { padding: 0.5rem 1rem; margin: 0.25rem; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Validation 1: MCP Python SDK under Pyodide</h1>

    <p><strong>Goal:</strong> Confirm <code>list_tools</code> + <code>call_tool</code> round-trip against an HTTP MCP server.</p>

    <div class="info result">
        <strong>Before testing:</strong> Start the MCP test server:<br>
        <code>cd spike/mcp_test_server && python server.py</code>
    </div>

    <div>
        <button id="test-sdk" py-click="test_sdk_import">Test 1: MCP SDK Import</button>
        <button id="test-http" py-click="test_http_client">Test 2: HTTP MCP Client</button>
        <button id="test-roundtrip" py-click="test_roundtrip">Test 3: Full Round-trip</button>
        <button id="test-all" py-click="run_all_tests">Run All Tests</button>
    </div>

    <div id="output"></div>

    <script type="py" config="./pyscript.toml">
import json
import asyncio
from pyscript import document, fetch, window

MCP_SERVER = "http://localhost:8765"

def log(message, css_class="info"):
    output = document.getElementById("output")
    div = document.createElement("div")
    div.className = f"result {css_class}"
    div.innerHTML = message
    output.appendChild(div)
    # Also log to console for debugging
    print(f"[{css_class}] {message[:100]}...")

async def test_sdk_import(event=None):
    """Test 1: Try to import the MCP Python SDK."""
    log("<strong>Test 1: MCP SDK Import</strong><br>Attempting to import mcp package...")

    try:
        import micropip
        await micropip.install("mcp")
        import mcp
        log(f"MCP SDK imported successfully! Version info: {dir(mcp)}", "pass")
        return True
    except Exception as e:
        log(f"MCP SDK import failed (expected): <pre>{type(e).__name__}: {e}</pre>"
            "<br><strong>Fallback:</strong> Use HTTP-based MCP client (Test 2)", "fail")
        return False

async def test_http_client(event=None):
    """Test 2: Test HTTP-based MCP client using fetch."""
    log("<strong>Test 2: HTTP MCP Client</strong><br>Testing fetch-based MCP calls...")

    try:
        response = await fetch(f"{MCP_SERVER}/tools")
        if response.status != 200:
            raise Exception(f"HTTP {response.status}")

        data = await response.json()
        tools = data["tools"]

        log(f"list_tools succeeded! Found {len(tools)} tools:<pre>{json.dumps(tools, indent=2)}</pre>", "pass")
        return True

    except Exception as e:
        log(f"HTTP client failed: <pre>{type(e).__name__}: {e}</pre>"
            "<br>Is the MCP test server running?", "fail")
        return False

async def test_roundtrip(event=None):
    """Test 3: Full round-trip - list tools, call tool, verify result."""
    log("<strong>Test 3: Full Round-trip</strong><br>Testing complete MCP flow...")

    try:
        # 1. List tools
        response = await fetch(f"{MCP_SERVER}/tools")
        tools_data = await response.json()
        tools = tools_data["tools"]
        log(f"Step 1: Listed {len(tools)} tools", "info")

        # 2. Call get_weather tool
        response = await fetch(
            f"{MCP_SERVER}/call-tool",
            method="POST",
            headers={"Content-Type": "application/json"},
            body=json.dumps({
                "name": "get_weather",
                "arguments": {"location": "San Francisco"}
            })
        )
        weather_result = await response.json()
        weather_text = weather_result["content"][0]["text"]
        log(f"Step 2: get_weather result: {weather_text}", "info")

        # 3. Call calculate tool
        response = await fetch(
            f"{MCP_SERVER}/call-tool",
            method="POST",
            headers={"Content-Type": "application/json"},
            body=json.dumps({
                "name": "calculate",
                "arguments": {"expression": "42 * 2"}
            })
        )
        calc_result = await response.json()
        calc_text = calc_result["content"][0]["text"]
        log(f"Step 3: calculate result: {calc_text}", "info")

        # Verify
        if "72" in weather_text and "84" in calc_text:
            log("<strong>VALIDATION 1 PASSED</strong><br>"
                "MCP round-trip works via HTTP/fetch. "
                "The MCP SDK itself won't load (httpx dependency), but "
                "HTTP-based MCP communication works fine.", "pass")
            return True
        else:
            log("Unexpected results", "fail")
            return False

    except Exception as e:
        log(f"Round-trip failed: <pre>{type(e).__name__}: {e}</pre>", "fail")
        return False

async def run_all_tests(event=None):
    """Run all tests in sequence."""
    log("<strong>Running all tests...</strong>", "info")

    # Test 2 first (HTTP client)
    await test_http_client()

    # Test 3 (full round-trip)
    await test_roundtrip()

    # Test 1 last (SDK import - slow and expected to fail)
    # await test_sdk_import()  # Skip for now - takes too long

log("Ready. Click buttons to run tests.", "info")
    </script>
</body>
</html>
