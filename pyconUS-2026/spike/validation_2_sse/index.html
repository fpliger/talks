<!DOCTYPE html>
<html lang="en">
<head>
    <title>Validation 2: SSE Streaming through Pyodide</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">

    <link rel="stylesheet" href="https://pyscript.net/releases/2026.2.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2026.2.1/core.js"></script>

    <style>
        body { font-family: system-ui, sans-serif; max-width: 800px; margin: 2rem auto; padding: 0 1rem; }
        .result { padding: 1rem; margin: 1rem 0; border-radius: 4px; }
        .pass { background: #d4edda; border: 1px solid #c3e6cb; }
        .fail { background: #f8d7da; border: 1px solid #f5c6cb; }
        .info { background: #d1ecf1; border: 1px solid #bee5eb; }
        pre { background: #f4f4f4; padding: 1rem; overflow-x: auto; }
        h1 { color: #333; }
        button { padding: 0.5rem 1rem; margin: 0.25rem; cursor: pointer; }
        #stream-output {
            min-height: 100px;
            border: 2px solid #007bff;
            padding: 1rem;
            margin: 1rem 0;
            font-family: monospace;
            white-space: pre-wrap;
        }
        .token { color: #007bff; }
        .timing { color: #666; font-size: 0.8em; }
    </style>
</head>
<body>
    <h1>Validation 2: SSE Streaming through Pyodide</h1>

    <p><strong>Goal:</strong> Confirm token streaming from LLM APIs works without buffering surprises.</p>

    <div class="info result">
        <strong>Before testing:</strong> Start the SSE test server:<br>
        <code>cd spike/validation_2_sse && python sse_server.py</code>
    </div>

    <div>
        <button id="test-stream" py-click="test_streaming">Test SSE Streaming</button>
        <button id="test-nonstream" py-click="test_non_streaming">Test Non-Streaming</button>
    </div>

    <div id="stream-output">Streaming output will appear here...</div>

    <div id="output"></div>

    <script type="py" config="./pyscript.toml">
import json
import time
from pyscript import document, fetch, window

SSE_SERVER = "http://localhost:8766"

def log(message, css_class="info"):
    output = document.getElementById("output")
    div = document.createElement("div")
    div.className = f"result {css_class}"
    div.innerHTML = message
    output.appendChild(div)
    print(f"[{css_class}] {message[:100]}...")

def clear_stream_output():
    document.getElementById("stream-output").innerHTML = ""

def append_token(token, timing=""):
    output = document.getElementById("stream-output")
    span = document.createElement("span")
    span.className = "token"
    span.textContent = token
    output.appendChild(span)
    if timing:
        timing_span = document.createElement("span")
        timing_span.className = "timing"
        timing_span.textContent = f" [{timing}ms]"
        output.appendChild(timing_span)

async def generate_events(response):
    """Generate SSE events from a streaming response.

    This is the pattern from inspo/client_side_tools_openai/hub_assistant.py
    """
    buffer = ""
    decoder = window.TextDecoder.new()
    reader = response.body.getReader()

    while True:
        result = await reader.read()
        if result.done:
            break

        try:
            text = decoder.decode(result.value)
            buffer += text

            while '\n' in buffer:
                line, buffer = buffer.split('\n', 1)

                if line.startswith("data: "):
                    line = line[6:]

                if line == "[DONE]":
                    return

                if line.strip():
                    try:
                        event = json.loads(line)
                        yield event
                    except json.JSONDecodeError:
                        continue

        except Exception as e:
            print(f"Error decoding: {e}")
            continue

async def test_streaming(event=None):
    """Test SSE streaming via ReadableStream."""
    clear_stream_output()
    log("<strong>Test: SSE Streaming</strong><br>Sending streaming request...")

    try:
        start_time = time.time()
        tokens_received = []
        token_times = []

        response = await fetch(
            f"{SSE_SERVER}/v1/chat/completions",
            method="POST",
            headers={"Content-Type": "application/json"},
            body=json.dumps({
                "messages": [{"role": "user", "content": "Hello"}],
                "stream": True
            })
        )

        if response.status != 200:
            raise Exception(f"HTTP {response.status}")

        first_token_time = None
        async for event in generate_events(response):
            now = time.time()

            if "choices" in event and event["choices"]:
                delta = event["choices"][0].get("delta", {})
                content = delta.get("content", "")

                if content:
                    if first_token_time is None:
                        first_token_time = now - start_time

                    tokens_received.append(content)
                    token_times.append(now - start_time)

                    # Update UI with each token
                    elapsed = int((now - start_time) * 1000)
                    append_token(content, str(elapsed))

        total_time = time.time() - start_time
        full_response = "".join(tokens_received)

        # Analysis
        log(f"<strong>Streaming Results:</strong><br>"
            f"Total tokens: {len(tokens_received)}<br>"
            f"First token time: {first_token_time*1000:.0f}ms<br>"
            f"Total time: {total_time*1000:.0f}ms<br>"
            f"Full response: <pre>{full_response}</pre>", "info")

        # Check if tokens arrived incrementally (not all at once)
        if len(token_times) > 5:
            time_diffs = [token_times[i+1] - token_times[i] for i in range(len(token_times)-1)]
            avg_diff = sum(time_diffs) / len(time_diffs)

            if avg_diff > 0.01:  # More than 10ms average between tokens
                log(f"<strong>VALIDATION 2 PASSED</strong><br>"
                    f"Tokens streamed incrementally (avg {avg_diff*1000:.0f}ms between tokens).<br>"
                    "SSE streaming through Pyodide's fetch works correctly!", "pass")
            else:
                log(f"Warning: Tokens may have been buffered (avg {avg_diff*1000:.0f}ms between tokens)", "fail")
        else:
            log("Not enough tokens to analyze streaming behavior", "info")

    except Exception as e:
        log(f"Streaming test failed: <pre>{type(e).__name__}: {e}</pre>"
            "<br>Is the SSE test server running?", "fail")

async def test_non_streaming(event=None):
    """Test non-streaming request for comparison."""
    clear_stream_output()
    log("<strong>Test: Non-Streaming</strong><br>Sending non-streaming request...")

    try:
        start_time = time.time()

        response = await fetch(
            f"{SSE_SERVER}/v1/chat/completions",
            method="POST",
            headers={"Content-Type": "application/json"},
            body=json.dumps({
                "messages": [{"role": "user", "content": "Hello"}],
                "stream": False
            })
        )

        data = await response.json()
        total_time = time.time() - start_time

        content = data["choices"][0]["message"]["content"]
        document.getElementById("stream-output").textContent = content

        log(f"<strong>Non-Streaming Results:</strong><br>"
            f"Response time: {total_time*1000:.0f}ms<br>"
            f"Response: <pre>{content}</pre>", "info")

    except Exception as e:
        log(f"Non-streaming test failed: <pre>{type(e).__name__}: {e}</pre>", "fail")

log("Ready. Click buttons to run tests.", "info")
    </script>
</body>
</html>
