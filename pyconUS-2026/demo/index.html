<!DOCTYPE html>
<html lang="en">
<head>
    <title>AI Router Demo — PyCon US 2026</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://pyscript.net/releases/2026.2.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2026.2.1/core.js"></script>

    <script type="module">
        import * as webllm from "https://esm.run/@mlc-ai/web-llm";
        window.webllm = webllm;
        window.webllmLoaded = true;
        if (webllm.prebuiltAppConfig?.model_list) {
            window.webllmModels = webllm.prebuiltAppConfig.model_list.map(m => m.model_id);
        }
        console.log("WebLLM loaded:", Object.keys(webllm).join(", "));
    </script>

    <style>
        :root {
            --browser-color: #1de9b6;
            --local-color:   #69f0ae;
            --remote-color:  #448aff;
            --hybrid-color:  #e040fb;
            --tool-color:    #ffab40;

            --bg:        #0d0f14;
            --surface:   #161920;
            --surface2:  #1e2129;
            --border:    #2a2d36;
            --text:      #e2e4ea;
            --muted:     #6b7280;
            --code-bg:   #11131a;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            font-size: 1.05rem;
            background: var(--bg);
            color: var(--text);
            max-width: 960px;
            margin: 0 auto;
            padding: 1.5rem 1.5rem 3rem;
            line-height: 1.6;
        }

        /* ── HEADER ─────────────────────────────────────── */
        header {
            text-align: center;
            padding: 1.5rem 0 2rem;
        }
        h1 {
            font-size: 1.75rem;
            font-weight: 600;
            letter-spacing: -.02em;
            color: #fff;
        }
        .subtitle {
            color: var(--muted);
            font-size: .9rem;
            margin-top: .3rem;
        }

        /* ── GLOBAL TIER SELECTOR ────────────────────────── */
        .tier-selector {
            display: flex;
            gap: .75rem;
            margin-bottom: 1rem;
        }
        .tier-btn {
            flex: 1;
            display: flex;
            align-items: center;
            gap: .6rem;
            padding: .7rem 1rem;
            border: 2px solid var(--border);
            border-radius: 10px;
            background: var(--surface);
            color: var(--muted);
            cursor: pointer;
            font-family: 'JetBrains Mono', monospace;
            font-size: .88rem;
            font-weight: 500;
            transition: all .15s;
            user-select: none;
        }
        .tier-btn:hover:not(:disabled) {
            border-color: var(--text);
            color: var(--text);
        }
        .tier-btn.active[data-tier="in-browser"] {
            border-color: var(--browser-color);
            background: color-mix(in srgb, var(--browser-color) 12%, var(--surface));
            color: var(--browser-color);
        }
        .tier-btn.active[data-tier="local"] {
            border-color: var(--local-color);
            background: color-mix(in srgb, var(--local-color) 12%, var(--surface));
            color: var(--local-color);
        }
        .tier-btn.active[data-tier="remote"] {
            border-color: var(--remote-color);
            background: color-mix(in srgb, var(--remote-color) 12%, var(--surface));
            color: var(--remote-color);
        }
        .tier-btn:disabled {
            opacity: .35;
            cursor: not-allowed;
        }
        .tier-btn .tier-dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: var(--border);
            flex-shrink: 0;
            transition: background .3s;
        }
        .tier-btn .tier-dot.checking { background: #ffc107; animation: pulse 1s ease-in-out infinite; }
        .tier-btn .tier-dot.ready    { background: var(--local-color); }
        .tier-btn .tier-dot.error    { background: #ef5350; }
        .tier-btn .tier-label { flex: 1; }
        .tier-btn .tier-status {
            font-size: .72rem;
            opacity: .7;
            font-weight: 400;
        }

        /* ── DEMO BUTTONS ────────────────────────────────── */
        .demo-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
            margin-bottom: 1.5rem;
        }
        .demo-btn {
            padding: .85rem 1rem;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--surface);
            color: var(--text);
            cursor: pointer;
            font-size: .9rem;
            font-family: 'Inter', sans-serif;
            font-weight: 500;
            transition: transform .15s, box-shadow .15s, background .15s, border-color .15s;
            text-align: left;
            line-height: 1.4;
        }
        .demo-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,.4);
            background: var(--surface2);
        }
        .demo-btn small { display: block; font-size: .78rem; opacity: .65; margin-top: .2rem; font-weight: 400; }
        .demo-btn:disabled { opacity: .4; cursor: not-allowed; transform: none; }

        /* ── PROGRESS BAR ────────────────────────────────── */
        #progress-container {
            margin-bottom: .75rem;
            display: none;
        }
        #progress-container.visible { display: block; }
        .progress-bar-track {
            width: 100%;
            height: 6px;
            background: var(--border);
            border-radius: 3px;
            overflow: hidden;
        }
        .progress-bar-fill {
            height: 100%;
            background: var(--browser-color);
            border-radius: 3px;
            transition: width .3s ease;
            width: 0%;
        }
        #progress-text {
            font-size: .78rem;
            color: var(--muted);
            margin-top: .3rem;
            font-family: 'JetBrains Mono', monospace;
        }

        /* ── CHAT ────────────────────────────────────────── */
        .chat-container {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
        }
        .messages {
            min-height: 320px;
            max-height: 520px;
            overflow-y: auto;
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            gap: .75rem;
        }
        .message {
            padding: .75rem 1rem;
            border-radius: 8px;
            max-width: 88%;
            font-size: .95rem;
        }
        .message.user {
            background: #1a2540;
            border: 1px solid #233057;
            margin-left: auto;
            color: #b3c8ff;
        }
        .message.assistant {
            background: var(--surface2);
            border: 1px solid var(--border);
        }
        .message.system {
            background: transparent;
            border: none;
            font-size: .82rem;
            color: var(--muted);
            text-align: center;
            max-width: 100%;
            font-style: italic;
        }
        .message.tool-call-pill {
            max-width: 100%;
            background: #1c1700;
            border: 1px solid #3d3000;
        }
        .message.tool-result {
            max-width: 100%;
            background: var(--code-bg);
            border: 1px solid var(--border);
            font-size: .83rem;
        }
        .message.tool-result details summary {
            cursor: pointer;
            color: var(--muted);
            padding: .25rem 0;
        }
        .tool-result-body {
            margin-top: .5rem;
            white-space: pre-wrap;
            font-family: 'JetBrains Mono', monospace;
            font-size: .8rem;
            color: #9da8b5;
            overflow-x: auto;
        }

        /* route badges */
        .route-badge {
            display: inline-block;
            padding: .15rem .5rem;
            border-radius: 4px;
            font-size: .72rem;
            font-weight: 600;
            margin-bottom: .4rem;
            font-family: 'JetBrains Mono', monospace;
            letter-spacing: .04em;
        }
        .route-badge.in-browser { background: var(--browser-color); color: #000; }
        .route-badge.browser    { background: var(--browser-color); color: #000; }
        .route-badge.local      { background: var(--local-color);   color: #000; }
        .route-badge.remote     { background: var(--remote-color);  color: #fff; }
        .route-badge.hybrid     { background: var(--hybrid-color);  color: #fff; }
        .route-badge.tool       { background: var(--tool-color);    color: #000; }

        /* tool call pill in message */
        .tool-call {
            background: #1c1700;
            border-left: 3px solid var(--tool-color);
            padding: .4rem .75rem;
            margin: .4rem 0;
            font-size: .82rem;
            font-family: 'JetBrains Mono', monospace;
            border-radius: 0 4px 4px 0;
        }

        /* content area — renders inline code etc */
        .message .content code {
            background: var(--code-bg);
            padding: .1rem .35rem;
            border-radius: 3px;
            font-family: 'JetBrains Mono', monospace;
            font-size: .88em;
        }
        .message .content pre, .message .content code[style] {
            display: block;
            background: var(--code-bg);
            border-radius: 6px;
            padding: .75rem;
            margin: .5rem 0;
            font-family: 'JetBrains Mono', monospace;
            font-size: .82rem;
            overflow-x: auto;
            white-space: pre-wrap;
        }

        /* streaming cursor */
        .streaming-cursor {
            display: inline-block;
            width: 2px;
            height: 1.1em;
            background: var(--text);
            vertical-align: middle;
            margin-left: 2px;
            animation: blink 1s step-end infinite;
        }
        @keyframes blink { 50% { opacity: 0; } }

        /* ── INPUT AREA ──────────────────────────────────── */
        .input-area {
            display: flex;
            gap: .6rem;
            padding: .9rem 1.25rem;
            border-top: 1px solid var(--border);
        }
        .input-area input {
            flex: 1;
            padding: .65rem .9rem;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: .95rem;
            font-family: 'Inter', sans-serif;
            outline: none;
        }
        .input-area input:focus { border-color: var(--remote-color); }
        .input-area input::placeholder { color: var(--muted); }
        .input-area button {
            padding: .65rem 1.2rem;
            background: var(--remote-color);
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: .9rem;
            font-weight: 500;
            transition: opacity .15s;
        }
        .input-area button:hover { opacity: .85; }

        /* ── STATUS BAR ──────────────────────────────────── */
        .status-bar {
            padding: .4rem 1.25rem;
            background: var(--code-bg);
            border-top: 1px solid var(--border);
            min-height: 2rem;
        }
        @keyframes pulse { 50% { opacity: .4; } }
    </style>
</head>
<body>
    <header>
        <h1>Hybrid AI Router Demo</h1>
        <p class="subtitle">Python orchestration in the browser · in-browser · local · remote · via PyScript</p>
    </header>

    <!-- Global tier selector -->
    <div class="tier-selector" role="group" aria-label="Select inference tier">
        <button class="tier-btn active" data-tier="in-browser" onclick="selectTier('in-browser')">
            <span class="tier-dot checking" id="dot-in-browser"></span>
            <span class="tier-label">In-browser</span>
            <span class="tier-status" id="status-in-browser">checking…</span>
        </button>
        <button class="tier-btn" data-tier="local" onclick="selectTier('local')">
            <span class="tier-dot checking" id="dot-local"></span>
            <span class="tier-label">Local</span>
            <span class="tier-status" id="status-local">checking…</span>
        </button>
        <button class="tier-btn" data-tier="remote" onclick="selectTier('remote')">
            <span class="tier-dot checking" id="dot-remote"></span>
            <span class="tier-label">Remote</span>
            <span class="tier-status" id="status-remote">checking…</span>
        </button>
    </div>

    <!-- WebLLM progress (shown only when loading in-browser model) -->
    <div id="progress-container">
        <div class="progress-bar-track">
            <div class="progress-bar-fill" id="progress-fill"></div>
        </div>
        <div id="progress-text">Initializing…</div>
    </div>

    <!-- Demo buttons -->
    <div class="demo-grid">
        <button class="demo-btn" id="demo1" py-click="run_demo_1">
            Demo 1: Date Conversion
            <small>Convert a date to ISO format</small>
        </button>
        <button class="demo-btn" id="demo2" py-click="run_demo_2">
            Demo 2: CSV Analysis
            <small>Pandas in-browser + LLM narrative</small>
        </button>
        <button class="demo-btn" id="demo3" py-click="run_demo_3">
            Demo 3: Agent + MCP Tools
            <small>web_search → save_to_file</small>
        </button>
    </div>

    <div class="chat-container">
        <div class="messages" id="messages">
            <div class="message system">
                Select a tier above and click a demo — or type your own message below.
            </div>
        </div>
        <div class="input-area">
            <input type="text" id="user-input" placeholder="Type a message and press Enter…" py-keydown="handle_keydown">
            <button py-click="send_message">Send</button>
        </div>
        <div class="status-bar">
            <span id="local-status-text" style="font-size:.78rem;color:var(--muted);font-family:'JetBrains Mono',monospace;"></span>
        </div>
    </div>

    <script>
        // ── Tier selection state ─────────────────────────────
        let _selectedTier = 'in-browser';

        function getDemoTier() { return _selectedTier; }

        function selectTier(tier) {
            _selectedTier = tier;
            document.querySelectorAll('.tier-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.tier === tier);
            });
            // Tint demo buttons to match active tier
            const colors = { 'in-browser': 'var(--browser-color)', 'local': 'var(--local-color)', 'remote': 'var(--remote-color)' };
            document.querySelectorAll('.demo-btn').forEach(btn => {
                btn.style.borderColor = colors[tier] || '';
            });
        }

        // ── Health probes ────────────────────────────────────
        const PROBES = {
            'in-browser': async () => {
                const gpu = !!navigator.gpu;
                const cache = typeof caches !== 'undefined';
                if (!gpu)    return { ok: false, text: 'no WebGPU' };
                if (!cache)  return { ok: false, text: 'no Cache API' };
                return { ok: true, text: 'WebGPU ready' };
            },
            'local': async () => {
                try {
                    const r = await fetch('http://localhost:11434/health', { signal: AbortSignal.timeout(1500) });
                    return r.ok ? { ok: true, text: 'connected' } : { ok: false, text: `HTTP ${r.status}` };
                } catch { return { ok: false, text: 'unreachable' }; }
            },
            'remote': async () => {
                try {
                    const r = await fetch('http://localhost:8766/health', { signal: AbortSignal.timeout(1500) });
                    return r.ok ? { ok: true, text: 'connected' } : { ok: false, text: `HTTP ${r.status}` };
                } catch { return { ok: false, text: 'unreachable' }; }
            },
        };

        // MCP is not a tier button but Demo 3 needs it — probe separately and
        // disable demo3 with a tooltip if it's unreachable.
        async function probeMcp() {
            try {
                const r = await fetch('http://localhost:8765/health', { signal: AbortSignal.timeout(1500) });
                const ok = r.ok;
                const btn = document.getElementById('demo3');
                if (btn) {
                    btn.disabled = !ok;
                    btn.title = ok ? '' : 'MCP server unreachable (port 8765)';
                    const small = btn.querySelector('small');
                    if (small) small.textContent = ok ? 'web_search → save_to_file' : '⚠ MCP server offline';
                }
            } catch {
                const btn = document.getElementById('demo3');
                if (btn) {
                    btn.disabled = true;
                    btn.title = 'MCP server unreachable (port 8765)';
                    const small = btn.querySelector('small');
                    if (small) small.textContent = '⚠ MCP server offline';
                }
            }
        }

        async function probeAll() {
            for (const [tier, probe] of Object.entries(PROBES)) {
                const dot    = document.getElementById(`dot-${tier}`);
                const status = document.getElementById(`status-${tier}`);
                const btn    = document.querySelector(`.tier-btn[data-tier="${tier}"]`);
                try {
                    const result = await probe();
                    dot.className    = `tier-dot ${result.ok ? 'ready' : 'error'}`;
                    status.textContent = result.text;
                    // Only disable if not the currently selected tier
                    if (!result.ok && tier !== _selectedTier) {
                        btn.disabled = true;
                    }
                } catch {
                    dot.className    = 'tier-dot error';
                    status.textContent = 'error';
                }
            }
        }

        // Run probes on load, then every 15s
        document.addEventListener('DOMContentLoaded', () => {
            probeAll();
            probeMcp();
            setInterval(() => { probeAll(); probeMcp(); }, 15000);
            // Apply initial tint
            selectTier(_selectedTier);
        });

        // ── Progress bar visibility (driven by PyScript status updates) ──
        const _progressObserver = new MutationObserver(() => {
            const text = document.getElementById('local-status-text')?.textContent || '';
            document.getElementById('progress-container')
                ?.classList.toggle('visible', text.includes('%') || text.includes('Loading'));
        });
        document.addEventListener('DOMContentLoaded', () => {
            const label = document.getElementById('local-status-text');
            if (label) _progressObserver.observe(label, { childList: true, subtree: true, characterData: true });
        });
    </script>

    <script type="py" src="./main.py" config="./pyscript.toml"></script>
</body>
</html>
